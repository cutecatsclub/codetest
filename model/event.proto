syntax = "proto3";

package model;

option go_package = "git.neds.sh/technology/pricekinetics/tools/codetest/model";

enum BettingStatus {
    BettingUnknown   = 0;
    BettingOpen      = 1;
    BettingSuspended = 2;
    BettingClosed    = 3;
}

message OptionalBettingStatus {
    BettingStatus Value   = 1;
    bool          Deleted = 2;
}

// Event models a betting match/race
message Event {
    string                  ID              = 1; 
    OptionalString          Name            = 2;
    OptionalInt64           StartTime       = 3;
    OptionalBettingStatus   BettingStatus   = 4;
    repeated Market         Markets         = 5; 
    OptionalString          EventTypeID     = 6; 
    SportEvent              SportData       = 7;
    OptionalBool            Hidden          = 8;
    RacingEvent             RacingData      = 9;
}

// RacingEvent models event details specific to horse, greyhound and harness racing
message RacingEvent {
    OptionalString  RaceType       = 1; // display name, set by RacingTransform e.g "Horse Racing"
    OptionalString  Venue          = 2; // e.g "Flemington"
    OptionalString  Region         = 3;
    OptionalInt64   RaceNumber     = 4;
    OptionalInt64   Distance       = 5; // metres
    OptionalString  TrackCondition = 6; // e.g "Good 4"
    OptionalString  RaceClass      = 7; // e.g "Group 1", "Maiden"
    repeated Runner Runners        = 8;
}

// SportEvent models event details that are specific to sports
message SportEvent {
    OptionalString Name     = 1; 
    OptionalString Region   = 2; 
    OptionalString League   = 3; 
    OptionalString Round    = 4; 
}

// Runner models a competitor in a race - Runner.ID matches Selection.ID in each market
message Runner {
    string         ID        = 1;
    OptionalString Name      = 2;
    OptionalInt64  Number    = 3; // saddlecloth / rug number
    OptionalInt64  Barrier   = 4; // barrier (horse/harness) or box (greyhound)
    OptionalString Jockey    = 5; // driver for harness
    OptionalString Trainer   = 6;
    OptionalDouble Weight    = 7; // kg, horse racing only
    OptionalBool   Scratched = 8;
}

// Market models a market of betting options e.g Head to Head or Totals
message Market {
    string                  ID            = 1;
    OptionalString          Name          = 2;
    OptionalInt64           StartTime     = 3;
    OptionalBettingStatus   BettingStatus = 4;
    repeated Selection      Selections    = 5;
}

// Selection models a betting options e.g Home Team or Over
message Selection {
    string                  ID              = 1;
    OptionalString          Name            = 2;
    OptionalBettingStatus   BettingStatus   = 3;
    OptionalDouble          Price           = 4;
}

message OptionalString {
    string Value   = 1;
    bool   Deleted = 2;
}

message OptionalDouble {
    double Value   = 1;
    bool   Deleted = 3;
}

message OptionalInt64 {
    int64 Value   = 1;
    bool  Deleted = 2;
}

message OptionalBool {
    bool Value   = 1;
    bool Deleted = 2;
}